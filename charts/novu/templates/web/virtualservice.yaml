{{- if .Values.web.enabled }}
{{- if and .Values.web.istio.enabled .Values.web.istio.virtualservice.enabled }}
{{- $webRoot := include "common.tplvalues.render" (dict "value" .Values.api.env.FRONT_BASE_URL "context" $) }}
{{- $webHost := $webRoot | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}
{{- $gateway := include "common.tplvalues.render" (dict "value" .Values.web.istio.virtualservice.gateway "context" $) }}
{{- $destination := include "common.tplvalues.render" (dict "value" .Values.web.istio.virtualservice.destination "context" $) }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "novu.componentName" (dict "context" $ "component" "web")}}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
spec:
  hosts:
    - {{ $webHost }}
  gateways:
    - {{ $gateway }}
  http:
    - headers:
        request:
          set:
            x-forwarded-host: {{ $webHost | quote }}
            x-forwarded-proto: "https"
      match:
        - authority:
            exact: {{ $webHost }}
      route:
        - destination:
            host: {{ $destination }}
            port:
              number: {{ .Values.web.istio.virtualservice.destinationPort }}
      {{- if .Values.web.istio.virtualservice.prefix }}
      match:
        - uri:
            prefix: {{ .Values.web.istio.virtualservice.prefix }}
      {{- end }}
      {{- if .Values.web.istio.virtualservice.rewriteUri }}
      rewrite:
        uri: {{ .Values.web.istio.virtualservice.rewriteUri }}
      {{- end }}
{{- end }}
{{- end }}
